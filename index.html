<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homework 22</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrapper">

    <div class="game-box" id="startScreen">
      <h1 class="title">Wanna Play game?</h1>
      <input type="text" id="nameInput" class="name-input" placeholder="What is your name" />
      <button class="start-btn" id="startGameBtn">Start Game</button>
      <div class="error-msg" id="errorMsg" hidden>Name Is Missing</div>
    </div>

    <div class="game-box" id="playerOneScreen">
      <h1 class="title" id="playerOneTitle"></h1>
      <input type="number" id="numberInput" class="name-input" placeholder="Give a number" />
      <button class="start-btn" id="letsPlayBtn">Lets Play</button>
      <div class="error-msg" id="numberErrorMsg" hidden>Number is missing</div>
    </div>

    <div class="game-box" id="playerTwoScreen">
      <h1 class="title">Player 2 Name?</h1>
      <input type="text" id="playerTwoNameInput" class="name-input" placeholder="What is your name" />
      <button class="start-btn" id="playerTwostartbtn">Next Player</button>
      <div class="error-msg" id="errorPlayerTwoName" hidden>Name is missing</div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
